<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cooked · Create account</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f0f4ef;color:#29483b;font-family:Arial,Helvetica,sans-serif}.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}.card{width:min(1080px,100%);min-height:650px;display:grid;grid-template-columns:1.05fr .95fr;background:#fffefa;border:1px solid #e4e9df;border-radius:32px;overflow:hidden;box-shadow:0 20px 70px #29483b12}.intro{display:flex;flex-direction:column;justify-content:space-between;padding:42px;background:#245d46;color:#fffdf7;position:relative;overflow:hidden}.intro:after{content:"";position:absolute;width:360px;height:360px;border:1px solid #ffffff22;border-radius:50%;right:-150px;bottom:-130px;box-shadow:0 0 0 28px #ffffff0d,0 0 0 56px #ffffff08}.brand{font-size:23px;font-weight:700;display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;display:block}.copy{position:relative;z-index:1}.copy h1{font-size:clamp(38px,4vw,60px);letter-spacing:-2.5px;line-height:1.02;margin:0 0 18px}.copy p{max-width:360px;color:#d9e7d8;line-height:1.65;margin:0;font-size:16px}.features{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:14px;color:#e7f0df;font-size:14px}.features li{display:flex;align-items:center;gap:10px}.features span{width:23px;height:23px;display:grid;place-items:center;border-radius:50%;background:#ffffff1a;color:#f2c95c}.note{font-size:12px;color:#b8d0b9;position:relative;z-index:1}.form{padding:42px;display:flex;flex-direction:column;justify-content:center}.kicker{text-transform:uppercase;letter-spacing:1.5px;color:#5a6b5a;font-size:11px;font-weight:700}.form h2{font-size:32px;letter-spacing:-1.2px;margin:9px 0 8px}.subtitle{color:#7b8878;font-size:14px;margin:0 0 26px;line-height:1.5}.fields{display:grid;gap:16px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:700;color:#526652}.field input,.field select{width:100%;min-width:0;height:48px;border:1px solid #dfe7dc;border-radius:12px;background:#fbfcf8;color:#29483b;padding:0 14px}.submit{height:48px;border:0;border-radius:13px;background:#2f7653;color:#fff;font-weight:700;margin-top:3px}.switch{text-align:center;color:#7b8878;font-size:13px;margin:24px 0 0}.switch a{color:#2f7653;font-weight:700;padding-left:4px}@media(max-width:760px){.auth{padding:0;align-items:stretch}.card{min-height:100vh;border:0;border-radius:0;display:block}.intro{min-height:260px;padding:28px 24px}.copy h1{font-size:40px;margin-bottom:10px}.copy p{font-size:14px}.features,.note{display:none}.form{padding:30px 24px 36px}.form h2{font-size:28px}}
</style>
<style>html,body{font-family:"Segoe UI",Arial,Helvetica,sans-serif}</style>
</head>
<body>
<main class="auth auth-signup">
  <div class="card">
    <aside class="intro">
      <div class="brand"><svg class="mark" viewBox="0 0 42 42" role="img" aria-label="Cooked tomato logo"><path d="M21 13C14 8 6 12 6 22c0 10 6 16 15 16s15-6 15-16c0-10-8-14-15-9Z" fill="#ed664b" stroke="#aa422f" stroke-width="1.2"/><path d="M21 13c-2-5 0-9 4-11M21 13c-4-4-8-4-12-2l7 3-4 4 9-2 6 4-2-6 8-3c-5-2-9-1-12 2Z" fill="#79a869" stroke="#5d8d52" stroke-width="1.1" stroke-linejoin="round"/><path d="M12 19c-1 3-1 6 0 8" fill="none" stroke="#ffb096" stroke-width="1.7" stroke-linecap="round"/></svg>Cooked</div>
      <div class="copy">
        <h1>Make room<br>for good food.</h1>
        <p>Plan meals that fit your week, keep your fridge fresh, and make cooking feel effortless.</p>
        <ul class="features"><li><span>&#10003;</span> Weekly meal planning</li><li><span>&#10003;</span> Smart shopping lists</li><li><span>&#10003;</span> Recipes made for you</li></ul>
      </div>
    </aside>
    <section class="form">
      <span class="kicker">Get started</span>
      <h2>Create your Cooked account</h2>
      <form class="fields" id="sign-up-form">
        <div class="field"><label for="name">Your name</label><input id="name" type="text" placeholder="Your name" autocomplete="name" required></div>
        <div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required></div>
        <div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" placeholder="Repeat your password" autocomplete="new-password" required></div>
        <div class="field"><label for="diet">Dietary preference</label><select id="diet" required><option value="">Choose a preference</option><option>Vegetarian</option><option>Balanced</option><option>Vegan</option></select></div>
        <div class="field"><label for="calories">Daily calorie target</label><input id="calories" type="number" min="800" max="5000" placeholder="e.g. 2000" required></div>
        <label style="display:flex;gap:8px;align-items:flex-start;color:#687868;font-size:12px;line-height:1.45"><input id="terms" type="checkbox" required> I agree to Cookeds terms and understand that preferences can be changed later.</label>
        <button class="submit" type="submit">Create account</button>
      </form>
    </section>
  </div>
</main>
<style>
.auth{padding:16px}
.auth .card{min-height:calc(100vh - 32px);height:auto}
.auth-signup .form{justify-content:flex-start;padding:34px 42px}
.auth-signup .fields{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.auth-signup .fields>.field:nth-child(1),
.auth-signup .fields>.field:nth-child(2),
.auth-signup .fields>.field:nth-child(3),
.auth-signup .fields>.field:nth-child(4),
.auth-signup .fields>.field:nth-child(5),
.auth-signup .fields>.field:nth-child(6){grid-column:auto}
.auth-signup .fields>label,
.auth-signup .fields>button{grid-column:1/-1}
@media(max-width:760px){
  .auth{padding:0}
  .auth .card{min-height:100vh}
  .auth-signup .form{padding:30px 24px 36px}
  .auth-signup .fields{grid-template-columns:1fr}
  .auth-signup .fields>.field{grid-column:1}
  .auth-signup .fields>label,.auth-signup .fields>button{grid-column:auto}
}
@media(min-width:761px) and (max-height:760px){
  .auth{align-items:flex-start}
  .auth .card{min-height:0}
  .auth-signup .form{padding-top:24px;padding-bottom:24px}
}
</style>
<script>
document.getElementById('sign-up-form').addEventListener('submit', event => {
  event.preventDefault();
  const form = event.currentTarget;
  const password = form.querySelector('#password');
  const confirm = form.querySelector('#confirm');
  let message = form.querySelector('.form-error');
  if (!message) { message = document.createElement('p'); message.className = 'form-error'; message.style.cssText = 'color:#a9523e;background:#fce8e2;padding:10px 12px;border-radius:10px;font-size:12px;margin:0'; form.prepend(message); }
  if ([...form.querySelectorAll('input:not([type="checkbox"])')].some(input => !input.value.trim()) || !form.querySelector('#terms').checked) { message.textContent = 'Complete all fields and accept the terms to create your account.'; return; }
  if (password.value.length < 8) { message.textContent = 'Use at least 8 characters for your password.'; return; }
  if (password.value !== confirm.value) { message.textContent = 'Passwords do not match.'; return; }
  localStorage.setItem('cooked:user-name', form.querySelector('#name').value.trim());
  localStorage.setItem('cooked:user-diet', form.querySelector('#diet').value);
  localStorage.setItem('cooked:user-calories', form.querySelector('#calories').value.trim());
  message.style.background = '#eef5e9'; message.style.color = '#4b6a48'; message.textContent = 'Account created. Opening sign in';
  setTimeout(() => { window.location.href = 'Sign-in.html'; }, 700);
});
</script>
</body>
</html>
