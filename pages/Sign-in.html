<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cooked · Sign in</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f0f4ef;color:#29483b;font-family:Arial,Helvetica,sans-serif}.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}.card{width:min(1080px,100%);min-height:650px;display:grid;grid-template-columns:1.05fr .95fr;background:#fffefa;border:1px solid #e4e9df;border-radius:32px;overflow:hidden;box-shadow:0 20px 70px #29483b12}.intro{display:flex;flex-direction:column;justify-content:space-between;padding:42px;background:#245d46;color:#fffdf7;position:relative;overflow:hidden}.intro:after{content:"";position:absolute;width:360px;height:360px;border:1px solid #ffffff22;border-radius:50%;right:-150px;bottom:-130px;box-shadow:0 0 0 28px #ffffff0d,0 0 0 56px #ffffff08}.brand{font-size:23px;font-weight:700;display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;display:block}.copy{position:relative;z-index:1}.copy h1{font-size:clamp(38px,4vw,60px);letter-spacing:-2.5px;line-height:1.02;margin:0 0 18px}.copy p{max-width:360px;color:#d9e7d8;line-height:1.65;margin:0;font-size:16px}.features{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:14px;color:#e7f0df;font-size:14px}.features li{display:flex;align-items:center;gap:10px}.features span{width:23px;height:23px;display:grid;place-items:center;border-radius:50%;background:#ffffff1a;color:#f2c95c}.note{font-size:12px;color:#b8d0b9;position:relative;z-index:1}.form{padding:42px;display:flex;flex-direction:column;justify-content:center}.kicker{text-transform:uppercase;letter-spacing:1.5px;color:#748574;font-size:11px;font-weight:700}.form h2{font-size:32px;letter-spacing:-1.2px;margin:9px 0 8px}.subtitle{color:#7b8878;font-size:14px;margin:0 0 26px;line-height:1.5}.fields{display:grid;gap:16px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:700;color:#526652}.field input,.field select{width:100%;min-width:0;height:48px;border:1px solid #dfe7dc;border-radius:12px;background:#fbfcf8;color:#29483b;padding:0 14px}.submit{height:48px;border:0;border-radius:13px;background:#2f7653;color:#fff;font-weight:700;margin-top:3px}.switch{text-align:center;color:#5d6a5a;font-size:13px;margin:24px 0 0}.switch a{color:#2f7653;font-weight:700;padding-left:4px}@media(max-width:760px){.auth{padding:0;align-items:stretch}.card{min-height:100vh;border:0;border-radius:0;display:block}.intro{min-height:260px;padding:28px 24px}.copy h1{font-size:40px;margin-bottom:10px}.copy p{font-size:14px}.features,.note{display:none}.form{padding:30px 24px 36px}.form h2{font-size:28px}}
</style>
<style>html,body{font-family:"Segoe UI",Arial,Helvetica,sans-serif}</style>
</head>
<body>
<main class="auth">
  <div class="card">
    <aside class="intro">
      <div class="brand"><svg class="mark" viewBox="0 0 42 42" role="img" aria-label="Cooked tomato logo"><path d="M21 13C14 8 6 12 6 22c0 10 6 16 15 16s15-6 15-16c0-10-8-14-15-9Z" fill="#ed664b" stroke="#aa422f" stroke-width="1.2"/><path d="M21 13c-2-5 0-9 4-11M21 13c-4-4-8-4-12-2l7 3-4 4 9-2 6 4-2-6 8-3c-5-2-9-1-12 2Z" fill="#79a869" stroke="#5d8d52" stroke-width="1.1" stroke-linejoin="round"/><path d="M12 19c-1 3-1 6 0 8" fill="none" stroke="#ffb096" stroke-width="1.7" stroke-linecap="round"/></svg>Cooked</div>
      <div class="copy">
        <h1>Make room<br>for good food.</h1>
        <p>Plan meals that fit your week, keep your fridge fresh, and make cooking feel effortless.</p>
        <ul class="features"><li><span>&#10003;</span> Weekly meal planning</li><li><span>&#10003;</span> Smart shopping lists</li><li><span>&#10003;</span> Recipes made for you</li></ul>
      </div>
    </aside>
    <section class="form">
      
      <h2>Sign in to Cooked</h2>
      <form class="fields" id="sign-in-form">
        
        <div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="At least 8 characters" autocomplete="current-password" required></div>
        <p style="margin:0;text-align:right;font-size:12px"><a href="#" onclick="event.preventDefault(); alert('Password reset would be sent here in the connected app.');">Forgot password?</a></p>
        
        <button class="submit" type="submit">Sign in</button>
      </form>
      <p class="switch">New to Cooked?<a href="Sign-up.html">Create an account</a></p>
    </section>
  </div>
</main>
<style>
.auth{padding:16px}
.auth .card{min-height:calc(100vh - 32px);height:auto}
@media(max-width:760px){
  .auth{padding:0}
  .auth .card{min-height:100vh}
}
@media(min-width:761px) and (max-height:760px){
  .auth{align-items:flex-start}
  .auth .card{min-height:0}
  .form{padding-top:28px;padding-bottom:28px}
}
</style>
<style id="full-screen-auth">
/* Full-screen layout and colours matched to the app pages (assets/css/styles.css). */
body{background:#fffdf8;color:#203b2e}
.auth,.auth.auth-signup{padding:0;min-height:100vh;align-items:stretch}
.auth .card{width:100%;max-width:none;min-height:100vh;height:auto;border:0;border-radius:0;box-shadow:none;background:#fffdf8}
.intro{background:#245d46;color:#fff}
.form{background:#fffdf8}
.form h2{color:#203b2e}
.kicker{color:#5a685a}
.field label{color:#536553}
.field input,.field select{border-color:#dfe7dc;background-color:#fff;color:#203b2e;font:inherit}
.submit{background:#245d46;font:inherit;font-weight:700;cursor:pointer}
.switch{color:#5a685a}
.switch a,.form a{color:#245d46}
.form input[type="checkbox"]{accent-color:#245d46}
.form label[style]{color:#5a685a!important}
@media(min-width:761px){.form,.auth-signup .form{padding-left:clamp(42px,6vw,96px);padding-right:clamp(42px,6vw,96px);justify-content:center}.form>*{width:100%;max-width:560px}}
@media(min-width:761px) and (max-height:760px){.auth .card{min-height:100vh}}
</style>
<script src="../assets/js/validation.js"></script>
<script>
document.getElementById('sign-in-form').addEventListener('submit', event => {
  event.preventDefault();
  const form = event.currentTarget;
  const email = form.querySelector('#email');
  const password = form.querySelector('#password');
  let message = form.querySelector('.form-error');
  if (!message) { message = document.createElement('p'); message.className = 'form-error'; message.style.cssText = 'color:#a9523e;background:#fce8e2;padding:10px 12px;border-radius:10px;font-size:12px;margin:0'; form.prepend(message); }
  if (!email.value.trim() || !password.value.trim()) { message.textContent = 'Enter your email and password to continue.'; return; }
  message.style.background = '#eef5e9'; message.style.color = '#4b6a48'; message.textContent = 'Signed in. Opening your meal dashboard';
  setTimeout(() => { window.location.href = 'Cooked.html'; }, 500);
});
</script>
</body>
</html>
