<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cooked  Preferences</title><link rel="stylesheet" href="../assets/css/styles.css"></head>
<body><div class="app"><aside class="sidebar"><a class="brand" href="Cooked.html"><svg class="brand-mark" viewBox="0 0 42 42" aria-hidden="true"><path d="M21 13C14 8 6 12 6 22c0 10 6 16 15 16s15-6 15-16c0-10-8-14-15-9Z" fill="#ed664b"/><path d="M21 13c-2-5 0-9 4-11M21 13c-4-4-8-4-12-2l7 3-4 4 9-2 6 4-2-6 8-3c-5-2-9-1-12 2Z" fill="#79a869"/></svg>Cooked</a><nav class="nav" aria-label="Main navigation"><a href="Cooked.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg><span>Dashboard</span></a><a href="Meal-planner.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M8 14h3M13 14h3M8 17h3"/></svg><span>Meal Planner</span></a><a href="Fridge.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16H6zM6 11h12M9 7v2M9 14v3"/></svg><span>Fridge</span></a><a href="Shopping-list.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l2 11h9l2-8H7M10 20h.01M17 20h.01"/></svg><span>Shopping List</span></a><a href="Budget.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M15 14h3"/></svg><span>Budget</span></a></nav></aside>
<main class="main"><div class="topbar"><span>Account / Preferences</span><button class="avatar" data-user-avatar aria-label="Current profile">CU</button></div><header class="page-head"><div><h1>Make Cooked yours</h1><p>These preferences shape your nutrition and weekly meal plan.</p></div><button class="btn" onclick="localStorage.removeItem('cooked:user-name'); location.href='Sign-in.html';">Sign out</button></header><form class="panel form-grid" data-demo-form data-success="Preferences saved. Your next plan will use the new goals."><div class="field full"><label for="name">Name</label><input id="name" data-user-name-input required></div><div class="field"><label for="diet">Dietary preference</label><select id="diet" required><option>Vegetarian</option><option>Balanced</option><option>Vegan</option></select></div><div class="field"><label for="calories">Daily calorie target</label><input id="calories" required type="number" min="800" max="5000"></div><div class="field"><label for="budget">Weekly grocery budget</label><input id="budget" required value="40 BD"></div><div class="field full"><label for="allergies">Allergies to avoid</label><input id="allergies" value="None"></div><div class="field full"><div class="callout error" data-form-error hidden>Tell us your name, calorie target, and weekly budget before saving.</div></div><div class="field full"><button class="btn primary" type="submit">Save preferences</button></div></form></main></div><div class="toast" role="status" aria-live="polite"></div><script>document.addEventListener('DOMContentLoaded',()=>{const name=localStorage.getItem('cooked:user-name')||'';const diet=localStorage.getItem('cooked:user-diet')||'Vegetarian';const calories=localStorage.getItem('cooked:user-calories')||'2000';document.querySelector('[data-user-name-input]').value=name;document.querySelector('#diet').value=diet;document.querySelector('#calories').value=calories;document.querySelector('[data-demo-form]').addEventListener('submit',()=>{localStorage.setItem('cooked:user-name',document.querySelector('[data-user-name-input]').value.trim());localStorage.setItem('cooked:user-diet',document.querySelector('#diet').value);localStorage.setItem('cooked:user-calories',document.querySelector('#calories').value);});});</script><script src="../assets/js/app.js"></script></body></html>
